# Workflow name shown in the GitHub Actions tab
name: Publish Docs

# Run this workflow only after the CI workflow completes on main
on:
  workflow_run:
    # Listen to the CI workflow by name
    workflows: ["CI"]
    # Trigger when CI reaches a completed state (success/failure/cancelled)
    types: [completed]
    # Only for CI runs from the main branch
    branches: ["main"]

# Permissions required for downloading CI artifacts and deploying Pages
permissions:
  # Read access to workflow artifacts from CI
  actions: read
  # Read repository metadata/content
  contents: read
  # Permission to publish to GitHub Pages
  pages: write
  # Required by deploy-pages for OIDC authentication
  id-token: write

# Avoid overlapping deployments; keep only the latest run
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Single deployment job: consume CI artifact and publish to Pages
  deploy:
    # Deploy only when the upstream CI workflow succeeded
    if: github.event.workflow_run.conclusion == 'success'
    environment:
      # Standard GitHub Pages environment
      name: github-pages
      # Expose deployed site URL in the workflow summary
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download the prebuilt site artifact produced by CI
      - name: Download Pages artifact from CI
        uses: actions/download-artifact@v4
        with:
          # Must match the artifact name uploaded in ci.yml
          name: github-pages-site
          # Download from the exact CI run that triggered this workflow
          run-id: ${{ github.event.workflow_run.id }}
          # Local folder where the static site files will be placed
          path: _site
          # Token used to authorize artifact download
          github-token: ${{ github.token }}

      # Step 2: Re-upload site files in Pages-specific artifact format
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # Step 3: Deploy uploaded Pages artifact to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
