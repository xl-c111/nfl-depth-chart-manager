name: Publish Docs

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build, test, coverage
        run: mvn -B verify

      - name: Generate Javadocs
        run: mvn -B javadoc:javadoc

      - name: Prepare Pages content
        run: |
          mkdir -p _site
          cp -R target/site/jacoco _site/coverage
          if [ -d target/site/apidocs ]; then
            cp -R target/site/apidocs _site/javadocs
          elif [ -d target/reports/apidocs ]; then
            cp -R target/reports/apidocs _site/javadocs
          else
            echo "Javadocs output folder not found."
            exit 1
          fi
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Depth Chart Manager Docs</title>
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 40px; line-height: 1.5; }
              h1 { margin-bottom: 8px; }
              ul { padding-left: 20px; }
            </style>
          </head>
          <body>
            <h1>Depth Chart Manager Docs</h1>
            <ul>
              <li><a href="./javadocs/index.html">Javadocs</a></li>
              <li><a href="./coverage/index.html">Coverage Report (JaCoCo)</a></li>
            </ul>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-docs
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
