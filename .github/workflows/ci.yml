# Workflow name shown in GitHub Actions
name: CI

# When this workflow should run
on:
  push: # Run on every push to any branch
  pull_request: # Run on every pull request (before merging)

jobs:
  # Single job: run tests and build verification
  test:
    runs-on: ubuntu-latest # Use a Linux runner

    steps:
      # Step 1: Download the repository code
      - name: Checkout
        uses: actions/checkout@v4

      # Step 2: Install Java (JDK 17) and enable Maven caching
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin # OpenJDK distribution
          java-version: "17"
          cache: maven # Cache dependencies to speed up builds

      # Step 3: Build the project and run all tests
      # mvn verify = compile + test + package + integration checks
      - name: Run verify
        run: mvn -B verify # -B = batch mode (no interactive input)

      # Step 4: Generate docs site content for GitHub Pages (main branch pushes only)
      - name: Generate Javadocs (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: mvn -B javadoc:javadoc

      # Step 5: Assemble Pages site folder from CI outputs (main branch pushes only)
      - name: Prepare Pages content (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p _site
          cp -R target/site/jacoco _site/coverage

          if [ -d target/site/apidocs ]; then
            cp -R target/site/apidocs _site/javadocs
          elif [ -d target/reports/apidocs ]; then
            cp -R target/reports/apidocs _site/javadocs
          else
            echo "Javadocs output folder not found."
            exit 1
          fi

          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Depth Chart Manager Docs</title>
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 40px; line-height: 1.5; }
              h1 { margin-bottom: 8px; }
              ul { padding-left: 20px; }
            </style>
          </head>
          <body>
            <h1>Depth Chart Manager Docs</h1>
            <ul>
              <li><a href="./javadocs/index.html">Javadocs</a></li>
              <li><a href="./coverage/index.html">Coverage Report (JaCoCo)</a></li>
            </ul>
          </body>
          </html>
          EOF

      # Step 6: Publish deployable Pages artifact from CI (main branch pushes only)
      - name: Upload Pages artifact (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: github-pages-site
          path: _site
          if-no-files-found: error
